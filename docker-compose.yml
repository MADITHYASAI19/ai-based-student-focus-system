# =============================================================================
# docker-compose.yml  ─  PRODUCTION / STAGING STACK
# =============================================================================
# This file reflects the intended production topology:
#   - Postgres 16  instead of SQLite
#   - Redis 7      instead of in-process TTLCache
#   - ChromaDB     running as an HTTP server (CHROMA_MODE=http)
#   - FastAPI app  served via uvicorn inside a container
#
# For LOCAL DEVELOPMENT (SQLite + embedded Chroma, no Docker needed),
# see docker-compose.dev.yml.
#
# Quick start (production):
#   cp .env.example .env   # fill in real secrets
#   docker compose up -d
# =============================================================================

version: '3.9'

services:
  # ---------------------------------------------------------------------------
  # Relational database (production replaces SQLite)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: study_companion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: study_companion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cache layer (production replaces in-process cachetools fallback)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: study_companion_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Vector store (production uses HTTP server; dev uses embedded PersistentClient)
  # ---------------------------------------------------------------------------
  chroma:
    image: chromadb/chroma:latest
    container_name: study_companion_chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      CHROMA_SERVER_HOST: "0.0.0.0"
      CHROMA_SERVER_PORT: "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study_companion_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/study_companion
      REDIS_URL: redis://redis:6379/0
      CHROMA_MODE: http
      CHROMA_URL: http://chroma:8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-openai/gpt-oss-120b}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
